name: Build Classic Releases

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Single build number to test (33-57). Leave empty to build all.'
        required: false
        default: ''
      publish:
        description: 'Publish or update the release'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: classic-mindustry-builds
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Compute builds
        id: matrix
        env:
          BUILD: ${{ inputs.build }}
        run: |
          if [ -z "$BUILD" ]; then
            list="$(seq -s, 33 57)"
          else
            if ! printf '%s' "$BUILD" | grep -Eq '^(3[3-9]|4[0-9]|5[0-7])$'; then
              echo "build must be between 33 and 57" >&2
              exit 1
            fi
            list="$BUILD"
          fi
          echo "matrix={\"build\":[$list]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.build }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build desktop jar
        env:
          BUILD: ${{ matrix.build }}
        run: bash scripts/build.sh

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: mindustry-desktop-${{ matrix.build }}
          path: out/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          pattern: mindustry-desktop-*
          path: release
          merge-multiple: true

      - name: Publish or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: classic-33-57
          target_commitish: ${{ github.sha }}
          name: Mindustry Classic Builds 33-57
          body: |
            Desktop jars built from the `v33`-`v57` tags of
            [Anuken/Mindustry](https://github.com/Anuken/Mindustry).

            Each jar is named `Mindustry-Desktop-<build>.jar`, where `<build>` is
            the `build` value in the jar's `version.properties`.
          files: release/*.jar
          overwrite_files: true
          make_latest: false

      # Updating a release leaves its tag alone, so move it to the commit this run built from.
      - name: Point the release tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/classic-33-57" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/classic-33-57" \
              -f sha="${{ github.sha }}" -F force=true
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/classic-33-57" -f sha="${{ github.sha }}"
          fi
